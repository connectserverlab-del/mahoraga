<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mahoraga · petal summon prototype</title>
<link rel="icon" href="/assets/logo.png" />
<style>
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url('/assets/inter.woff2') format('woff2');
  }
  :root {
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --glass: rgba(255,255,255,.62); --glass-line: rgba(255,255,255,.75); --glass-ink: #4a4058;
    --rose: #e8a3bb; --gold: #e6c98a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #e9e0f2; }
  body { font: 14px/1.5 var(--font); color: var(--glass-ink); -webkit-font-smoothing: antialiased; }

  /* ── The domain: the same idle sakura clip the console uses ─────────────── */
  .domain { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .domain video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* ── Petal layer: one 2D canvas above the scene ─────────────────────────── */
  /* Above every viewer (cards carry z-index up to ~100 for deck order), below the HUD. */
  #petals { position: fixed; inset: 0; z-index: 200; pointer-events: none; }

  /* ── Viewers. Each tab is one of these, laid out at full size at the origin
        and placed with a transform. The deck is the same elements at
        different depths, so riffling is just retargeting transforms. ─────── */
  .viewer { position: fixed; z-index: 2; left: 0; top: 0; transform-origin: 0 0; opacity: 0;
    border-radius: 18px; overflow: hidden; pointer-events: none;
    background: rgba(24, 18, 30, .58);
    box-shadow: 0 30px 80px rgba(60, 30, 70, .35), inset 0 0 0 1px rgba(255,255,255,.18);
    backdrop-filter: blur(6px) saturate(120%); -webkit-backdrop-filter: blur(6px) saturate(120%);
    transition: transform .7s cubic-bezier(.22,.9,.3,1), opacity .45s ease, filter .7s ease; }
  .viewer.direct { transition: none; }          /* while a hand holds it: no lag */
  .viewer.active { pointer-events: auto; }
  .viewer.sinking { opacity: 0 !important; transition: transform 1.1s ease-in, opacity .9s ease-in; }
  .viewer .chrome { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px;
    background: rgba(255,255,255,.08); border-bottom: 1px solid rgba(255,255,255,.12); color: #f3e9f2; }
  .viewer .tab { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 550;
    padding: 6px 12px; border-radius: 9px; background: rgba(255,255,255,.12); white-space: nowrap; }
  .viewer .tab .fav { width: 10px; height: 10px; border-radius: 50% 0 50% 50%; background: var(--accent, var(--rose)); transform: rotate(45deg); }
  .viewer .url { flex: 1; font-family: var(--mono); font-size: 12px; color: rgba(243,233,242,.75);
    background: rgba(0,0,0,.22); border-radius: 9px; padding: 6px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer .step { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
  /* Fake pages, so the summon has something to reveal. Replace with the real feed. */
  .page { position: absolute; inset: 44px 0 0 0; padding: 22px 26px; color: #efe6ee; overflow: hidden; }
  .page .hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .page .brand { font-weight: 700; letter-spacing: -.01em; font-size: 15px; }
  .page .nav { display: flex; gap: 16px; font-size: 12px; opacity: .7; }
  .page .hero { height: 26%; border-radius: 12px; margin-bottom: 18px; display: flex; align-items: flex-end; padding: 16px; font-size: 13px; opacity: .9;
    background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 38%, transparent), rgba(230,201,138,.22)); }
  .page .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .page .card { border-radius: 12px; background: rgba(255,255,255,.08); padding: 12px; font-size: 12px; min-height: 120px;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; border: 1px solid rgba(255,255,255,.08); }
  .page .card .sw { height: 48px; border-radius: 8px; background: rgba(255,255,255,.12); margin-bottom: auto; }
  .page .btn { align-self: flex-start; padding: 5px 9px; border-radius: 7px; font-size: 11px;
    background: color-mix(in srgb, var(--accent) 30%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); }
  .page .btn.target { background: rgba(230,201,138,.32); border-color: rgba(230,201,138,.7); }
  .page .lines { display: flex; flex-direction: column; gap: 10px; }
  .page .line { height: 12px; border-radius: 6px; background: rgba(255,255,255,.12); }
  .page .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.06); font-size: 12px; }
  .page .row .who { width: 120px; font-weight: 600; }
  .page .row .sub { flex: 1; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── HUD ────────────────────────────────────────────────────────────────── */
  .hud { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 300; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 96vw; }
  .hud button { font: inherit; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: #6b5f7a;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; padding: 8px 14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer; transition: .15s; white-space: nowrap; }
  .hud button:hover { background: rgba(255,255,255,.8); color: #3f3550; }
  .hud button[aria-pressed="true"] { background: rgba(232,163,187,.55); border-color: rgba(232,163,187,.8); color: #4a2035; }
  .hud kbd { font: inherit; opacity: .6; margin-right: 4px; }
  .panel { position: fixed; z-index: 300; font-family: var(--mono); font-size: 11px; color: #6b5f7a; line-height: 1.5;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 12px; padding: 8px 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: .85; pointer-events: none; }
  .stat { right: 16px; bottom: 26px; }
  .log { left: 16px; top: 16px; width: 300px; }
  .log b { color: #4a2035; font-weight: 600; }
  .log .t { opacity: .55; }
  .log .hint { border-top: 1px solid rgba(0,0,0,.08); margin-top: 6px; padding-top: 6px; opacity: .75; }
  @media (max-width: 900px) { .stat, .log { display: none; } }
</style>
</head>
<body>

<div class="domain">
  <video muted autoplay loop playsinline preload="auto">
    <source src="/assets/voice/idle.webm" type="video/webm">
    <source src="/assets/voice/idle.mp4" type="video/mp4">
  </video>
</div>

<div id="viewers"></div>
<canvas id="petals"></canvas>

<div class="panel log" id="log"></div>
<div class="hud">
  <button data-cmd="summon"><kbd>Space</kbd>New tab</button>
  <button data-cmd="prev"><kbd>←</kbd>Prev</button>
  <button data-cmd="next"><kbd>→</kbd>Next</button>
  <button data-cmd="back"><kbd>B</kbd>Send back</button>
  <button data-cmd="close"><kbd>Esc</kbd>Close</button>
  <button data-cmd="click"><kbd>C</kbd>Click</button>
  <button data-cmd="think" id="b-think" aria-pressed="false"><kbd>T</kbd>Thinking</button>
  <button data-cmd="calm" id="b-calm" aria-pressed="false"><kbd>M</kbd>Calm</button>
</div>
<div class="panel stat" id="stat"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Petal summon prototype, round three: a stacked deck with an event surface
// for hand gestures.
//
// The gesture side is being built separately. This file exposes everything a
// gesture layer needs on `window.MahoragaTabs`, in two layers:
//
//   Intents  — one call, one outcome. Attach a recognised gesture to one.
//     MahoragaTabs.send('summon')            new tab, summoned from the canopy
//     MahoragaTabs.send('next')  / 'prev'    riffle the deck one card
//     MahoragaTabs.send('back')              active tab goes to the back
//     MahoragaTabs.send('close')             active tab sinks into the pool
//     MahoragaTabs.send('click', {x, y})     click tell at a screen point
//     MahoragaTabs.send('think', {on})       thinking orbit on/off
//     MahoragaTabs.send('scale', {factor})   multiply the deck's size (clamped)
//     MahoragaTabs.send('scale.to', {scale}) set it absolutely
//     MahoragaTabs.send('move', {dx, dy})    nudge the deck
//
//   Continuous — for gestures with a clutch (pinch) that track the hand:
//     'hand'        {id, x, y, pinch}   where a hand is; draws a petal cursor
//     'hand.lost'   {id}                the hand left the frame
//     'grab'        {id, x, y}          pinch closed: hold the active frame
//     'grab.move'   {id, x, y}          move while held
//     'grab.end'    {id, x, y, vx, vy}  pinch opened. Velocity decides:
//                                        fast sideways → next/prev, fast down
//                                        toward the pool → close, else drop
//     'scrub'       {id, x}             start riffling from a screen x
//     'scrub.move'  {id, x}             cards fan under the hand
//     'scrub.end'   {id, vx}            snap to the nearest card
//     'stretch'     {id, distance}      two-hand pinch: start resizing
//     'stretch.move'{id, distance}      resize by the ratio to the start
//     'stretch.end' {id}
//
//   Outcomes — subscribe with MahoragaTabs.on(name, fn):
//     'tab.summoned', 'tab.activated', 'tab.closed', 'deck.changed',
//     'deck.moved', 'deck.scaled', 'grab.rejected' (nothing under the hand)
//
// A virtual hand driven by the mouse exercises the same surface here:
// move = 'hand', drag = grab, shift+drag = scrub, wheel = scale.
// The petal engine (wind, flutter, settle) is unchanged from round two.
// ─────────────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('petals');
const ctx = canvas.getContext('2d', { alpha: true });
const viewersEl = document.getElementById('viewers');
const statEl = document.getElementById('stat');
const logEl = document.getElementById('log');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0, now = 0;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutDeck(true);
}
window.addEventListener('resize', resize);

// ── Helpers
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
const flightEase = t => smoothstep(0, 0.14, t) * (1 - Math.pow(1 - t, 2.6));
function lerpAngle(a, b, t) { let d = (b - a + Math.PI * 3) % (Math.PI * 2) - Math.PI; return a + d * t; }

// ── Petal sprites
const TINTS = [['#fbe4ec', '#f2b7cb'], ['#f9d5e0', '#eea6bf'], ['#fdeff4', '#f4c3d3'], ['#f6c6d6', '#e79ab6']];
const SPRITE = 28;
const sprites = TINTS.map(([light, deep]) => {
  const c = document.createElement('canvas'); c.width = c.height = SPRITE * 2;
  const g = c.getContext('2d'); g.scale(2, 2); g.translate(SPRITE / 2, SPRITE / 2);
  const grad = g.createRadialGradient(0, 2, 1, 0, 0, SPRITE / 2);
  grad.addColorStop(0, deep); grad.addColorStop(0.55, light); grad.addColorStop(1, light);
  g.fillStyle = grad; g.beginPath();
  g.moveTo(0, 11); g.bezierCurveTo(-11, 6, -12, -6, -5, -10); g.quadraticCurveTo(-1, -8, 0, -5);
  g.quadraticCurveTo(1, -8, 5, -10); g.bezierCurveTo(12, -6, 11, 6, 0, 11); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(190,110,140,.18)'; g.lineWidth = .6; g.stroke();
  return c;
});

// ── Settings
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const settings = {
  calm: prefersReduced,
  get count()    { return this.calm ? 170 : 480; },
  get duration() { return this.calm ? 0.9 : 1.45; },
  get swirl()    { return this.calm ? 0.3 : 1.0; },
  get ambient()  { return this.calm ? 8 : 20; },
  get windScale(){ return this.calm ? 0.4 : 1.0; },
};

// ── Wind
const gust = { x: 0, y: 0 };
function wind(x, y, t) {
  const kx = x * 0.0042, ky = y * 0.0042;
  const wx = Math.sin(kx * 1.3 + t * 0.9) * 0.6 + Math.sin(ky * 2.1 - t * 0.7 + 1.7) * 0.4 + Math.sin((kx + ky) * 0.7 + t * 0.35) * 0.5;
  const wy = Math.cos(kx * 1.7 - t * 0.6 + 0.4) * 0.35 + Math.sin(ky * 1.1 + t * 0.8 + 2.3) * 0.3;
  const s = 24 * settings.windScale;
  return { x: wx * s + gust.x, y: wy * s + gust.y };
}
function blow(fromX, fromY, toX, toY, strength) {
  const dx = toX - fromX, dy = toY - fromY, len = Math.hypot(dx, dy) || 1;
  gust.x += dx / len * strength; gust.y += dy / len * strength;
}
function canopyPoint() {
  const a = rand(0, Math.PI * 2), r = Math.sqrt(Math.random());
  return { x: W * 0.5 + Math.cos(a) * r * W * 0.42, y: H * 0.24 + Math.sin(a) * r * H * 0.2 };
}
const waterline = () => H * 0.8;
function perimeterPoint(f, u) {
  const per = 2 * (f.w + f.h); let d = ((u % 1) + 1) % 1 * per;
  if (d < f.w) return { x: f.x + d, y: f.y };
  d -= f.w; if (d < f.h) return { x: f.x + f.w, y: f.y + d };
  d -= f.h; if (d < f.w) return { x: f.x + f.w - d, y: f.y + f.h };
  d -= f.w; return { x: f.x, y: f.y + f.h - d };
}

// ── Petals. mode: ambient | gather | settle | border | fall | orbit | cursor | fade
const petals = [], ripples = [];
function makePetal(x, y) {
  return {
    x, y, px: x, py: y, mode: 'ambient', sprite: (Math.random() * sprites.length) | 0,
    size: rand(0.55, 1.05), rot: rand(0, Math.PI * 2), spin: rand(-1.6, 1.6),
    flip: rand(0, Math.PI * 2), alpha: 1, born: now, tab: null,
    phase: rand(0, Math.PI * 2), freq: rand(3.2, 5.6), amp: rand(22, 58), fall: rand(34, 62), vx: 0, vy: 0,
  };
}
function spawnAmbient(fresh) {
  const p = makePetal(rand(0, W), fresh ? rand(-40, H * 0.5) : rand(-60, -20)); p.alpha = rand(.5, .9); petals.push(p);
}
function flutterStep(p, dt, gravityRamp) {
  p.phase += p.freq * dt;
  const swing = Math.sin(p.phase), w = wind(p.x, p.y, now);
  const vy = p.fall * (0.55 + 0.45 * Math.abs(Math.cos(p.phase))) * gravityRamp;
  p.x += (swing * p.amp + w.x + p.vx) * dt; p.y += (vy + w.y * 0.5 + p.vy) * dt;
  p.vx *= Math.pow(0.15, dt); p.vy *= Math.pow(0.15, dt);
  p.rot = lerpAngle(p.rot, p.baseRot + swing * 0.7, 1 - Math.pow(0.02, dt));
  p.flip += (1.6 + Math.abs(swing) * 2.2) * dt;
}
function startFlight(p, s, t, dur) {
  p.mode = 'gather'; p.born = now; p.sx = s.x; p.sy = s.y; p.tx = t.x; p.ty = t.y; p.dur = dur; p.isClick = false;
  const dx = t.x - s.x, dy = t.y - s.y, len = Math.hypot(dx, dy) || 1, side = Math.random() < 0.5 ? -1 : 1;
  const arc = len * rand(0.15, 0.42) * settings.swirl * side;
  p.cx = (s.x + t.x) / 2 + (-dy / len) * arc; p.cy = (s.y + t.y) / 2 + (dx / len) * arc + len * 0.08;
  p.nx = -dy / len; p.ny = dx / len; p.wobA = rand(6, 16) * settings.swirl; p.wobF = rand(5, 9);
  p.ox = 0; p.oy = 0; p.delay = p.delay || 0;
}
function startFall(p, delay) {
  p.mode = 'fall'; p.fallAt = now + delay; p.baseRot = p.rot; p.rippled = false; p.tab = null;
  p.vx = rand(-20, 20); p.vy = rand(-30, 5);
  if (Math.random() < 0.2) p.vy = rand(-90, -40);
}

// ── The deck ───────────────────────────────────────────────────────────────
// tabs[0] is the active (front) card. The whole deck shares one placement:
// `view` is the offset and scale a hand has given it. `scrub` is the
// continuous riffle offset in cards while a hand is fanning the deck.
const SITES = [
  { name: 'example.shop', url: 'https://example.shop/collections/tea-sets?sort=price', accent: '#e8a3bb', kind: 'shop', step: 'Step 3 · add to cart' },
  { name: 'docs.example', url: 'https://docs.example/api/reference#authentication', accent: '#a9c4e6', kind: 'docs', step: 'Step 1 · read auth section' },
  { name: 'mail.example', url: 'https://mail.example/inbox?label=invoices', accent: '#9fc7a8', kind: 'mail', step: 'Step 2 · open latest invoice' },
  { name: 'maps.example', url: 'https://maps.example/search/tea+house+near+me', accent: '#e6c98a', kind: 'docs', step: 'Step 4 · copy address' },
];
const tabs = [];
let nextSite = 0;
const base = { w: 0, h: 0 };
const view = { x: 0, y: 0, scale: 1 };
const scrub = { on: false, s: 0, x0: 0, s0: 0 };
const DEPTH_SHOWN = 4, DEPTH_RISE = 30, DEPTH_SHRINK = 0.07;

function pageHtml(site) {
  if (site.kind === 'shop') return `
    <div class="hdr"><div class="brand">${site.name}</div><div class="nav"><span>Tea</span><span>Sets</span><span>Journal</span><span>Cart (0)</span></div></div>
    <div class="hero">Spring collection · free shipping over $40</div>
    <div class="grid">
      <div class="card"><div class="sw"></div>Kyusu, cedar<span>$62</span><span class="btn">Add to cart</span></div>
      <div class="card"><div class="sw"></div>Yunomi pair<span>$28</span><span class="btn target">Add to cart</span></div>
      <div class="card"><div class="sw"></div>Chasen whisk<span>$19</span><span class="btn">Add to cart</span></div>
      <div class="card"><div class="sw"></div>Matcha bowl<span>$44</span><span class="btn">Add to cart</span></div>
    </div>`;
  if (site.kind === 'mail') return `
    <div class="hdr"><div class="brand">${site.name}</div><div class="nav"><span>Inbox</span><span>Starred</span><span>Sent</span></div></div>
    <div class="lines">
      <div class="row"><span class="who">Kettle & Co.</span><span class="sub">Invoice #4471 for your March order</span><span class="btn target">Open</span></div>
      <div class="row"><span class="who">Yamada Tea</span><span class="sub">Your shipment is on its way</span><span class="btn">Open</span></div>
      <div class="row"><span class="who">Studio Kiln</span><span class="sub">Re: custom glaze samples</span><span class="btn">Open</span></div>
      <div class="row"><span class="who">Bank</span><span class="sub">Statement ready</span><span class="btn">Open</span></div>
    </div>`;
  return `
    <div class="hdr"><div class="brand">${site.name}</div><div class="nav"><span>Guides</span><span>Reference</span><span>Changelog</span></div></div>
    <div class="hero">Authentication</div>
    <div class="lines"><div class="line" style="width:80%"></div><div class="line" style="width:92%"></div><div class="line" style="width:60%"></div>
      <div class="line" style="width:88%"></div><div class="line" style="width:40%"></div></div>
    <div style="margin-top:16px"><span class="btn target">Copy token</span></div>`;
}
function createTab() {
  const site = SITES[nextSite++ % SITES.length];
  const el = document.createElement('div'); el.className = 'viewer'; el.style.setProperty('--accent', site.accent);
  el.innerHTML = `
    <div class="chrome"><div class="tab"><span class="fav"></span> ${site.name}</div><div class="url">${site.url}</div><div class="step">${site.step}</div></div>
    <div class="page">${pageHtml(site)}</div>`;
  viewersEl.appendChild(el);
  const tab = { el, site, state: 'summoning', settledTotal: 0, settled: 0, id: 'tab-' + (nextSite) };
  el.addEventListener('click', e => { if (tab === active() && tab.state === 'held') clickTell(e.clientX, e.clientY); });
  return tab;
}
const active = () => tabs[0] || null;

// The active frame's rectangle: base size, scaled and offset by the hand.
function frontRect() {
  const w = base.w * view.scale, h = base.h * view.scale;
  return { x: W / 2 + view.x - w / 2, y: H * 0.44 + view.y - h / 2, w, h };
}
// Where a card at continuous depth d sits. Depth 0 is the front; deeper cards
// rise behind it and shrink. Negative depth is a card being riffled off the
// front: it slides out to the side and thins.
function cardPlacement(d) {
  const f = frontRect();
  if (d >= 0) {
    const s = Math.max(0.5, 1 - DEPTH_SHRINK * d), w = f.w * s, h = f.h * s;
    return { x: f.x + (f.w - w) / 2, y: f.y - DEPTH_RISE * view.scale * d, w, h, s: view.scale * s,
      opacity: Math.max(0.25, 1 - 0.18 * d), bright: Math.max(0.55, 1 - 0.12 * d), z: 100 - Math.round(d * 10) };
  }
  const k = -d, s = Math.max(0.6, 1 - 0.08 * k), w = f.w * s, h = f.h * s;
  return { x: f.x + (f.w - w) / 2 - f.w * 0.62 * k, y: f.y + 24 * k, w, h, s: view.scale * s,
    opacity: Math.max(0, 1 - 0.7 * k), bright: 1, z: 100 + Math.round(k * 10) };
}
function layoutDeck(immediate) {
  base.w = Math.min(W * 0.72, 1120, H * 0.60 * 1.6); base.h = base.w * 10 / 16;
  const n = tabs.length;
  tabs.forEach((t, i) => {
    let d = i - scrub.s;
    if (n > 1 && d < -0.5) d += n;        // riffled past the front: wraps to the back
    const p = cardPlacement(d);
    t.rect = p;

// and sends the same intents.
(() => {
  const ID = 'mouse'; let down = null; const trail = [];
  // Wall-clock timestamps: the animation clock only advances per frame, and a
  // slow frame would make a fresh flick look stale.
  const clock = () => performance.now() / 1000;
  const velocity = () => {
    // Speed over the last few samples; a hand that paused before letting go is a drop.
    const pts = trail.slice(-6);
    if (pts.length < 2 || clock() - pts[pts.length - 1].t > 0.3) return { vx: 0, vy: 0 };
    const a = pts[0], b = pts[pts.length - 1], dt = Math.max(b.t - a.t, 0.016);
    return { vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt };
  };
  window.addEventListener('pointermove', e => {
    trail.push({ x: e.clientX, y: e.clientY, t: clock() }); if (trail.length > 12) trail.shift();
    if (down === 'scrub') MahoragaTabs.send('scrub.move', { id: ID, x: e.clientX });
    else if (down === 'grab') MahoragaTabs.send('grab.move', { id: ID, x: e.clientX, y: e.clientY });
    else MahoragaTabs.send('hand', { id: ID, x: e.clientX, y: e.clientY, pinch: 0 });
  });
  window.addEventListener('pointerdown', e => {
    if (e.target.closest('.hud')) return;
    MahoragaTabs.send('hand', { id: ID, x: e.clientX, y: e.clientY, pinch: 1 });
    if (e.shiftKey) { down = 'scrub'; MahoragaTabs.send('scrub', { id: ID, x: e.clientX }); }
    else { down = 'grab'; MahoragaTabs.send('grab', { id: ID, x: e.clientX, y: e.clientY }); }
  });
  window.addEventListener('pointerup', e => {
    const v = velocity();
    if (down === 'scrub') MahoragaTabs.send('scrub.end', { id: ID, vx: v.vx });
    else if (down === 'grab') MahoragaTabs.send('grab.end', { id: ID, x: e.clientX, y: e.clientY, vx: v.vx, vy: v.vy });
    down = null; MahoragaTabs.send('hand', { id: ID, x: e.clientX, y: e.clientY, pinch: 0 });
  });
  window.addEventListener('wheel', e => { e.preventDefault(); MahoragaTabs.send('scale', { factor: Math.exp(-e.deltaY * 0.0012) }); }, { passive: false });
  document.addEventListener('mouseleave', () => MahoragaTabs.send('hand.lost', { id: ID }));
})();
</script>
</body>
